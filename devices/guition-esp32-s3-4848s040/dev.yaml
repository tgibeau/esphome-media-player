substitutions:
  name: "music-dashboard-dev"
  friendly_name: "Music Dashboard Dev"
  sonos_default_ip: "192.168.1.67"
  # Not using Home Assistant — hide all config entities from the API so the
  # timezone select (141 options) and other large selects don't OOM the device
  # when an API client connects and requests the entity list.
  ha_config_internal: "true"

wifi:
  # Disable WiFi modem sleep so the PHY PLL never needs re-enabling during
  # CPU idle; prevents the phy_track_pll_init abort (ESP32-S3 chip rev v0.2
  # bug triggered when SOAP task + main loop are both blocking).
  power_save_mode: none
  ap:

captive_portal:

esphome:
  on_boot:
    priority: -200
    then:
      - lambda: |-
          // Fallback: if no IP was restored from NVS, use the pre-baked default
          const std::string default_ip = "${sonos_default_ip}";
          if (!default_ip.empty() && id(sonos_ip_entity).state.empty()) {
            ESP_LOGI("dev", "No Sonos IP in NVS, using default: %s", default_ip.c_str());
            id(sonos_ip_entity).publish_state(default_ip);
          }

packages:
  music_dashboard: !include packages.yaml

external_components:
  - source:
      type: local
      path: ../../components
    components: [artwork_image, mipi_rgb]
